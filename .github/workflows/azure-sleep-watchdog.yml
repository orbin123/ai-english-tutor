name: Azure sleep watchdog

# PostgreSQL Flexible Server automatically starts after seven days stopped.
# This autonomous hourly safety net returns expired environments to cold state.
# It intentionally does not reference the reviewer-gated production Environment;
# doing so would leave every scheduled stop waiting for human approval.

on:
  schedule:
    - cron: "17 * * * *"

concurrency:
  # Keep the safety net independent from reviewer-gated runs that can wait for
  # approval. The live-window tag prevents it from stopping intentional work.
  group: azure-production-watchdog
  cancel-in-progress: false

permissions: {}

env:
  AZURE_CORE_OUTPUT: none
  AZURE_RESOURCE_GROUP: rg-lingosai-prod
  AZURE_VM_NAME: vm-lingosai-prod
  AZURE_POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}

jobs:
  enforce-cold-state:
    name: enforce expired live window
    if: ${{ vars.AZURE_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Enforce expired environment state
        run: .github/scripts/azure-control-plane.sh watchdog

      - name: Watchdog summary
        if: ${{ always() }}
        run: |
          {
            echo "### Azure sleep watchdog"
            echo "- Checked the bounded \`lingosai-active-until\` resource-group tag."
            echo "- An active future window is left untouched."
            echo "- An absent, invalid, or expired window is drained, VM-deallocated, and PostgreSQL-stopped."
            echo "- Any failed stop operation fails this workflow and triggers normal GitHub Actions notifications."
          } >>"$GITHUB_STEP_SUMMARY"
